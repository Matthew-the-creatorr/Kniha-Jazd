name: KnihaJazd
options:
  bundleIdPrefix: sk.knihajazd
  deploymentTarget:
    iOS: "16.0"
targets:
  KnihaJazd:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.knihajazd.mobile
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Kniha jázd
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Kniha jázd potrebuje presnú polohu počas zaznamenávania jazdy.
        NSCameraUsageDescription: Fotografia tankovacieho bločku.
        UIBackgroundModes:
          - location
