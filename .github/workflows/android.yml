name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack bundled AI showroom art
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          unzip -o assets/garage_colors.zip -d app/src/main/res/drawable-nodpi
          test -f app/src/main/res/drawable-nodpi/garage_black.jpg
      - name: Build prototype
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KnihaJazd-0.6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
