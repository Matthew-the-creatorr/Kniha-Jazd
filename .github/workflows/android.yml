name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle licensed showroom photo
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 --max-time 90 \
            'https://images.pexels.com/photos/10186994/pexels-photo-10186994.jpeg?auto=compress&cs=tinysrgb&w=1050' \
            --output app/src/main/res/drawable-nodpi/garage_showroom.jpg
          file app/src/main/res/drawable-nodpi/garage_showroom.jpg
          test "$(wc -c < app/src/main/res/drawable-nodpi/garage_showroom.jpg)" -gt 25000
      - name: Build prototype
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KnihaJazd-0.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
